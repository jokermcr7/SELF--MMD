services:
  - type: worker
    name: telegram-manager-bot
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    autoDeploy: true
    envVars:
      - key: BOT_TOKEN
        sync: false
      - key: OWNER_ID
        sync: false
      - key: DATABASE_URL
        fromDatabase:
          name: mmd-self-db
          property: connectionString
      - key: GAME_GROUP_ID
        value: "-1003816728822"
      - key: DEFAULT_TIMEZONE
        value: Europe/Tehran
      - key: TG_API_ID
        sync: false
      - key: TG_API_HASH
        sync: false
      - key: SESSION_SECRET
        sync: false

databases:
  - name: mmd-self-db
    databaseName: mmd_self_db
    user: mmd_self_user
    plan: free
